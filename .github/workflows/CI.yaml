name: CI

on:
  push:
    branches:
      - main
      - dev
      - dev/*
  pull_request:

# If a new push on the PR is done, cancel the build
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: 3.23.4
  RUSTFLAGS: "-D warnings"

jobs:
  dashboard-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ferromq
      - id: dashboard
        working-directory: ferromq
        run: echo "sha=$(tr -d '[:space:]' < ferromq-plugins/ferromq-http-api/dashboard-dist/COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sllt/ferromq-dashboard
          ref: ${{ steps.dashboard.outputs.sha }}
          path: dashboard
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - working-directory: dashboard
        run: pnpm install --frozen-lockfile && pnpm build
      - run: |
          python3 - <<'PY'
          import hashlib, pathlib
          source = pathlib.Path('dashboard/dist')
          embedded = pathlib.Path('ferromq/ferromq-plugins/ferromq-http-api/dashboard-dist')
          ignored = {'COMMIT', 'SOURCE', 'README.md', 'THIRD_PARTY_NOTICES.txt'}
          def hashes(root, ignored):
              return {
                  p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*')
                  if p.is_file() and p.relative_to(root).as_posix() not in ignored
              }
          assert hashes(source, set()) == hashes(embedded, ignored), 'dashboard-dist is stale'
          assert (embedded / 'THIRD_PARTY_NOTICES.txt').is_file(), 'third-party notice missing'
          PY

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake g++ pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev
          else
            apt-get update
            apt-get install -y cmake g++ pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev
          fi
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: Install nasm on Windows
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  tests:
    name: Test ${{ matrix.os }} (rust ${{matrix.toolchain}})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        toolchain:
          - "1.94.0"  # minimum supported rust version
          - stable
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake g++ pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev
          else
            apt-get update
            apt-get install -y cmake g++ pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev
          fi
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: Install nasm on Windows
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - name: Execute tests
        run: cargo test --workspace --all-features --all-targets
        env:
          RUST_BACKTRACE: full
