[workspace]
resolver = "2"
members = [
    "ferromq",
    "ferromq-plugins",
    "ferromq-plugins/ferromq-*",
    "ferromq-bin",
    "ferromq-macros",
    "ferromq-codec",
    "ferromq-net",
    "ferromq-conf",
    "ferromq-utils",
    "ferromq-storage",
    "ferromq-test",
    "ferromq/examples/*",
]
exclude = [
    "ferromq-raft",
]

[patch.crates-io]
ferromq = { path = "ferromq" }
ferromq-codec = { path = "ferromq-codec" }
ferromq-net = { path = "ferromq-net" }
ferromq-conf = { path = "ferromq-conf" }
ferromq-macros = { path = "ferromq-macros" }
ferromq-utils = { path = "ferromq-utils" }
ferromq-storage = { path = "ferromq-storage" }
ferromq-raft = { path = "ferromq-raft" }

ferromq-plugins = { path = "ferromq-plugins" }
#ferromq-plugin-template = { path = "ferromq-plugins/ferromq-plugin-template" }
ferromq-acl = { path = "ferromq-plugins/ferromq-acl" }
ferromq-web-hook = { path = "ferromq-plugins/ferromq-web-hook" }
ferromq-auth-http = { path = "ferromq-plugins/ferromq-auth-http" }
ferromq-auth-jwt = { path = "ferromq-plugins/ferromq-auth-jwt" }
ferromq-cluster-broadcast = { path = "ferromq-plugins/ferromq-cluster-broadcast" }
ferromq-cluster-raft = { path = "ferromq-plugins/ferromq-cluster-raft" }
ferromq-counter = { path = "ferromq-plugins/ferromq-counter" }
ferromq-http-api = { path = "ferromq-plugins/ferromq-http-api" }
ferromq-retainer = { path = "ferromq-plugins/ferromq-retainer" }
ferromq-sys-topic = { path = "ferromq-plugins/ferromq-sys-topic" }
ferromq-session-storage = { path = "ferromq-plugins/ferromq-session-storage" }
ferromq-message-storage = { path = "ferromq-plugins/ferromq-message-storage" }
ferromq-topic-rewrite = { path = "ferromq-plugins/ferromq-topic-rewrite" }
ferromq-auto-subscription = { path = "ferromq-plugins/ferromq-auto-subscription"}
ferromq-bridge-ingress-mqtt = { path = "ferromq-plugins/ferromq-bridge-ingress-mqtt" }
ferromq-bridge-egress-mqtt = { path = "ferromq-plugins/ferromq-bridge-egress-mqtt" }
ferromq-bridge-ingress-kafka = { path = "ferromq-plugins/ferromq-bridge-ingress-kafka" }
ferromq-bridge-egress-kafka = { path = "ferromq-plugins/ferromq-bridge-egress-kafka" }
ferromq-bridge-ingress-pulsar = { path = "ferromq-plugins/ferromq-bridge-ingress-pulsar"}
ferromq-bridge-egress-pulsar = { path = "ferromq-plugins/ferromq-bridge-egress-pulsar"}
ferromq-bridge-ingress-nats = { path = "ferromq-plugins/ferromq-bridge-ingress-nats"}
ferromq-bridge-egress-nats = { path = "ferromq-plugins/ferromq-bridge-egress-nats"}
ferromq-bridge-egress-reductstore = { path = "ferromq-plugins/ferromq-bridge-egress-reductstore"}
ferromq-bridge-origin = { path = "ferromq-plugins/ferromq-bridge-origin"}
ferromq-p2p-messaging = { path = "ferromq-plugins/ferromq-p2p-messaging"}
ferromq-shared-subscription = { path = "ferromq-plugins/ferromq-shared-subscription" }


[workspace.package]
version = "0.24.0"
edition = "2021"
authors = ["rmqtt <rmqttd@126.com>"]
description = "FerroMQ MQTT Server for v3.1, v3.1.1 and v5.0 protocols"
repository = "https://github.com/sllt/ferromq.git"
license = "MIT OR Apache-2.0"
categories = ["network-programming"]
keywords = ["MQTT", "IoT", "messaging", "MQTT-Server", "MQTT-Broker"]
exclude = [".gitignore", ".cargo/config"]
rust-version = "1.94.0"


[workspace.dependencies]
ferromq = "0.24.0"
ferromq-codec = "0.3.1"
ferromq-net = "0.4.0"
ferromq-conf = "0.4.0"
ferromq-macros = "0.1.2"
ferromq-utils = "0.1.6"
ferromq-storage = { version = "0.11.1", path = "ferromq-storage", default-features = false }
ferromq-raft = { version = "0.7.2", path = "ferromq-raft", default-features = false }

ferromq-plugins = "0.24.0"
ferromq-acl = "0.24.0"
ferromq-retainer = "0.24.0"
ferromq-http-api = "0.24.0"
ferromq-counter = "0.24.0"
ferromq-auth-http = "0.24.0"
ferromq-auth-jwt = "0.24.0"
ferromq-auto-subscription = "0.24.0"
ferromq-bridge-egress-kafka = "0.24.0"
ferromq-bridge-ingress-kafka = "0.24.0"
ferromq-bridge-egress-mqtt = "0.24.0"
ferromq-bridge-ingress-mqtt = "0.24.0"
ferromq-bridge-ingress-pulsar = "0.24.0"
ferromq-bridge-egress-pulsar = "0.24.0"
ferromq-bridge-ingress-nats = "0.24.0"
ferromq-bridge-egress-nats = "0.24.0"
ferromq-bridge-egress-reductstore = "0.24.0"
ferromq-bridge-origin = "0.24.0"
ferromq-message-storage = "0.24.0"
ferromq-session-storage = "0.24.0"
ferromq-sys-topic = "0.24.0"
ferromq-topic-rewrite = "0.24.0"
ferromq-web-hook = "0.24.0"
ferromq-cluster-raft = "0.24.0"
ferromq-cluster-broadcast = "0.24.0"
ferromq-shared-subscription = "0.24.0"
ferromq-p2p-messaging = "0.24.0"

tokio = { version = "1",  default-features = false }
reqwest = "0.12"
futures = "0.3"
serde = "1.0"
tokio-util = "0.7"
tokio-rustls = "0.26"
socket2 = "0.5"
prost = "0.13"
rustls = "0.23"
once_cell = "1.21.3"
dashmap = "6.1.0"
ahash = "0.8"
bytes = "1.10"
bytestring = "1.4"
thiserror = "1.0.69"
anyhow = "1.0.99"
async-trait = "0.1"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false }
uuid = "1.11.0"
rand = "0.9.0"
governor = "0.10"
config = { version = "0.15.8", default-features = false}
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
base64 = "0.22"
postcard = { version = "1.1", features = ["use-std"] }
url = { version = "2.5.4", default-features = false }
systemstat = "0.2"
itertools = "0.14"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.29"

bitflags = "2.9.2"
leaky-bucket = "1.1.2"
scc = "2.3.4"
get-size2 = "0.9"
prometheus = "0.14"
futures-time = "3.0"
nonzero_ext = "0.3"
itoa = "1.0.15"
simple_logger = "5.0.0"
regex = "1.11.1"
backoff = "0.4"
webpki-roots = "0.26"
toml = "0.9"
rust-box = "0.18"
scopeguard = "1"
rayon = "1.11.0"
parking_lot = "0.12.4"
proxy-protocol = "0.5"
jsonwebtoken = "9.3.1"
quinn = "0.11.6"
time = "0.3"
strum = "0.26"

# Circuit breaker for gRPC inter-node communication
tower = { version = "0.5", features = ["util"] }
tower-resilience-circuitbreaker = "0.10"

[profile.dev]
opt-level = 0

[profile.release]
lto = true
opt-level = 's'
codegen-units = 1
panic = "abort"
